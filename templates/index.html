<!DOCTYPE html>
<html>
<head>
    <title>Smart Attendance System</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        input { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Attendance System ✅</h1>
        <p>Flask deployment successful on Railway.</p>
        
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        
        <h2>Mark Attendance</h2>
        <input type="text" id="subject" placeholder="Subject">
        <input type="number" id="lecture" placeholder="Lecture Number">
        <input type="text" id="absent" placeholder="Absent Rolls (comma-separated)">
        <button onclick="markAttendance()">Mark Attendance</button>
        
        <h2>Notifications</h2>
        <button onclick="getNotifications()">Load Notifications</button>
        <div id="notifications"></div>
    </div>
    
    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            alert(data.message);
        }
        
        async function markAttendance() {
            const subject = document.getElementById('subject').value;
            const lecture_number = document.getElementById('lecture').value;
            const absent_rolls = document.getElementById('absent').value;
            const res = await fetch('/api/attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subject, lecture_number, absent_rolls })
            });
            const data = await res.json();
            alert(data.message);
        }
        
        async function getNotifications() {
            const res = await fetch('/api/notifications');
            const data = await res.json();
            document.getElementById('notifications').innerHTML = 
                data.map(n => `<p><strong>${n.type}:</strong> ${n.message}</p>`).join('');
        }
    </script>
</body>
</html>
